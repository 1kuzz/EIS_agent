# categories.yml - Полная конфигурация категорий v11.0 ТУРБО
# ==============================================================
# Все поля чувствительны к регистру КЛЮЧА, но не к значению.
# Строки include/exclude/required нормализуются («lower & strip»),
# поэтому не важен регистр в значении.

# ---------- Шаблон того, что понимает парсер ------------------
# <category_id>:
#   name: "Читаемое название"          # попадёт в таблицу category
#   okpd_prefix: "xx.yy.zz.xxx"        # один префикс
#   ktru:                              # ≤100 кодов; "*" допускается в конце
#     - "код1"
#     - "код2"
#   include_keywords: [ "слово1", "слово2", "…" ]   # хотя бы одно должно быть
#   exclude_keywords: [ "…" ]                      # НИ одного не должно быть
#   required_params: [ "обязательный параметр", … ] # каждый — обязан присутствовать
#   min_price: 0            # опционально (руб.)
#   max_price: 0            # 0 = нет ограничения
#   regions: []             # список кодов; пусто — все регионы
# ---------------------------------------------------------------

